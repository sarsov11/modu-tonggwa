<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>개념 — 모두의 통과</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/g.css">
<script>try{var _s=localStorage.getItem("modutg2.skin")||"white";document.documentElement.dataset.skin=_s;}catch(e){document.documentElement.dataset.skin="white";}</script>
<style>
  .hd h1{font-size:26px;letter-spacing:-.03em;margin:26px 0 4px;font-weight:900}
  .hd p{margin:0;color:var(--ink-3);font-size:14.5px}
  .li{display:flex;justify-content:space-between;gap:10px;padding:13px 4px 13px 16px;border-top:1px solid var(--line);
    color:inherit;text-decoration:none;font-size:16px;font-weight:600}
  .li small{color:var(--ink-3);font-weight:500;font-size:13.5px}
  /* 과목 머리 — 아래 단원 줄과 한눈에 갈리게 색 띠·개수·접힘 표시(2026-10-08 대표님 「물리랑 그 아래 단원 구분이 어려움」) */
  .sub{margin-top:14px;border:1.5px solid var(--line-2);border-radius:var(--r2);overflow:hidden;background:var(--surface)}
  .sub>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;
    font-weight:900;font-size:19px;padding:14px 16px;background:var(--tg-soft);color:var(--accent);letter-spacing:-.02em}
  .sub>summary::-webkit-details-marker{display:none}
  .sub>summary small{font-size:14px;font-weight:700;color:var(--ink-3);letter-spacing:0}
  .sub>summary::after{content:"▾";margin-left:auto;font-size:16px;color:var(--ink-3);transition:transform .2s}
  .sub:not([open])>summary::after{transform:rotate(-90deg)}
  .sub>.li:first-of-type{border-top:0}
  .go{margin-top:28px}
</style>
</head><body>
<div class="page">
  <div class="hd"><h1 id="ttl">개념</h1><p id="sub"></p></div>
  <div id="body"></div>
</div>
<script src="js/gdata.js"></script>
<script src="js/gstore.js"></script>
<script src="js/kan.js"></script>
<script>
(function(){
  GS.내비("card.html");
  var D=GS.D, e=GS.esc, k=new URLSearchParams(location.search).get("k");
  var 몸=document.getElementById("body");
  if(k && D.cards[k]){
    var t=GS.테마맵[k]||{};
    document.getElementById("ttl").textContent=t.n||k;
    document.getElementById("sub").textContent=(t.p||"")+" · "+(t.h||"");
    몸.innerHTML=KAN.그리기(D.cards[k].칸)+
      '<div class="go"><a class="b main" href="ox.html?k='+encodeURIComponent(k)+'">O·X</a>'+
      '<div class="b2"><a class="b" href="gichul.html?k='+encodeURIComponent(k)+'">기출 원문</a>'+
      '<a class="b" href="card.html">다른 단원 학습</a></div></div>';
    GS.카드봄(k);
    return;
  }
  var 과목={}, 차례=[];
  D.테마.forEach(function(t){
    if(!D.cards[t.k]) return;
    if(!과목[t.s]){과목[t.s]=[];차례.push(t.s);}
    과목[t.s].push(t);
  });
  몸.innerHTML=차례.map(function(s,i){
    return '<details class="sub"'+(i===0?' open':'')+'><summary>'+e(s)+'<small>'+과목[s].length+'단원</small></summary>'+과목[s].map(function(t){
      return '<a class="li" href="card.html?k='+encodeURIComponent(t.k)+'"><span>'+e(t.n)+'</span><small>'+
        (GS.S.카드[t.k]?"읽음":"")+'</small></a>';
    }).join("")+'</details>';
  }).join("");
})();
</script>
</body></html>
