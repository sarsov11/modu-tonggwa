<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>합격 지도 — 모두의 통과</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/g.css">
<script>try{var _s=localStorage.getItem("modutg2.skin")||"white";document.documentElement.dataset.skin=_s;}catch(e){document.documentElement.dataset.skin="white";}</script>
<style>
  /* 2026-11-10 화면표준 11절 — 합격 지도(공용 js/tera-map.js?v=1111g). 줄 = 과목 분야, 칸 = 중단원 */
  .page.map{max-width:1180px}
  .hd{display:none}
  .tm{padding-top:16px}
</style>
</head><body>
<div class="page map">
  <div id="m"></div>
</div>
<script src="js/gdata.js"></script>
<script src="js/gstore.js"></script>
<script src="js/tera-map.js?v=1111g"></script>
<script>
(function(){
  GS.내비("tree.html");
  var D=GS.D, 줄={}, 차례=[], 기출수={}, 연도={};
  /* avg = 기출 문항 수 ÷ 기출이 나온 해 수 (gdata 의 gichul 실제 문항에서만 센다) */
  (D.gichul||[]).forEach(function(x){
    기출수[x.k]=(기출수[x.k]||0)+1;
    var m=/(\d{2})\.\d/.exec(x.y||""); if(m) 연도[m[1]]=1;
  });
  var 해=Math.max(1,Object.keys(연도).length);
  function r1(v){ return Math.round(v*10)/10; }
  D.테마.forEach(function(t){
    if(!줄[t.s]){ 줄[t.s]={name:t.s,nodes:{},list:[]}; 차례.push(t.s); }
    var g=줄[t.s], id=t.s+"|"+t.h;
    if(!g.nodes[id]){ g.nodes[id]={id:id,name:t.h,leaves:[],_k:[]}; g.list.push(g.nodes[id]); }
    var m=GS.숙련(t.k), n=g.nodes[id];
    n.leaves.push({name:t.n,avg:r1((기출수[t.k]||0)/해),pct:m==null?0:Math.round(m*100),k:t.k});
    n._k.push(t.k);
  });
  var 모두=[];
  var groups=차례.map(function(s){
    var g=줄[s];
    g.list.forEach(function(n){
      n.avg=r1(n.leaves.reduce(function(a,l){return a+l.avg;},0));
      n.pct=Math.round(n.leaves.reduce(function(a,l){return a+l.pct;},0)/n.leaves.length);
      모두.push(n);
    });
    return {name:g.name,nodes:g.list};
  });
  /* 추천 순서 — 1번은 오늘 카드의 첫 단계와 같은 테마, 나머지는 중요도 × 남은 정도 */
  var 할=GS.오늘할것&&GS.오늘할것(), 첫=null;
  if(할&&할.k) 모두.forEach(function(n){ if(n._k.indexOf(할.k)>=0) 첫=n; });
  var 나머지=모두.filter(function(n){return n!==첫 && n.pct<80;}).sort(function(a,b){
    return b.avg*(1-b.pct/100)-a.avg*(1-a.pct/100); });
  var 차=(첫?[첫]:[]).concat(나머지).slice(0,3);
  차.forEach(function(n,i){ n.order=i+1; });
  function 가기(k){ return (D.cards||{})[k] ? "card.html?k="+encodeURIComponent(k) : "ox.html?k="+encodeURIComponent(k); }
  var dd=GS.디데이();
  TERA_MAP.mount(document.getElementById("m"),{
    title:"합격 지도", sub:D.종목, unit:"문항", dday: dd==null?"":(dd>0?"D-"+dd:(dd===0?"D-DAY":"시험 끝")),
    groups:groups, mark:"star",
    onLeaf:function(l){ location.href=가기(l.k); },
    onStart:function(n){
      var 고름=n.leaves.slice().sort(function(a,b){ return a.pct-b.pct; })[0];
      location.href=가기(고름.k);
    }
  });
})();
</script>
