<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>킬러 드릴 — 모두의 통과</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/g.css">
<script>try{var _s=localStorage.getItem("modutg2.skin")||"white";document.documentElement.dataset.skin=_s;}catch(e){document.documentElement.dataset.skin="white";}</script>
<style>
  .hd h1{font-size:26px;letter-spacing:-.03em;margin:26px 0 4px;font-weight:900}
  .hd p{margin:0;color:var(--ink-3);font-size:14.5px;line-height:1.6}
  .tag{display:inline-block;background:var(--tg-gold);color:#3A6036;font-weight:900;font-size:12px;
    padding:3px 8px;border-radius:6px;letter-spacing:.04em}
  .topic{display:block;border:1.5px solid var(--line-2);border-radius:var(--r3);padding:18px;margin-top:14px;
    text-decoration:none;color:inherit;background:var(--surface)}
  .topic b{display:block;font-size:18px;margin:8px 0 4px}
  .topic small{color:var(--ink-3);font-size:14px}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0 6px}
  .tabs button{appearance:none;border:1.5px solid var(--line-2);background:var(--surface-2);border-radius:var(--r1);
    padding:11px 4px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;color:var(--ink-2)}
  .tabs button.on{border-color:var(--accent);color:var(--accent);background:var(--tg-soft)}
  .stp{list-style:none;padding:0;margin:14px 0 0;counter-reset:s}
  .stp li{background:var(--tg-soft);border-radius:var(--r2);padding:12px 14px 12px 46px;margin-bottom:8px;
    position:relative;font-size:15.5px;line-height:1.6;counter-increment:s}
  .stp li::before{content:counter(s);position:absolute;left:12px;top:12px;width:24px;height:24px;border-radius:50%;
    background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px}
  .card{border:1px solid var(--line-2);border-radius:var(--r2);padding:14px;margin-top:16px;background:var(--surface)}
  .card .y{font-size:13.5px;color:var(--ink-3);font-weight:700;margin-bottom:8px}
  .fb{font-size:15px;font-weight:800;margin:4px 0 8px}
  .fb.ok{color:var(--accent)} .fb.no{color:var(--red)}
</style>
</head><body>
<div class="page">
  <div class="hd"><h1 id="ttl">킬러 드릴</h1>
    <p id="sub">고2 학평 · 수능 예비시행 2.5점</p></div>
  <div id="body"></div>
</div>
<script src="js/gdata.js"></script>
<script src="js/gstore.js"></script>
<script src="js/kan.js"></script>
<script>
(function(){
  GS.내비("drill.html");
  var D=GS.D, e=GS.esc, P=new URLSearchParams(location.search), k=P.get("k");
  var 몸=document.getElementById("body"), 번="①②③④⑤";
  var 주=(D.drill||[]).filter(function(d){return d.k===k;})[0];
  if(!주){
    몸.innerHTML=(D.drill||[]).map(function(d){
      return '<a class="topic" href="drill.html?k='+encodeURIComponent(d.k)+'"><span class="tag">KILLER DRILL</span>'+
        '<b>'+e(d.n)+'</b><small>'+e(d.s)+' · 단계 쪼개기 '+d.단계.length+' · 기출 '+d.모음.length+'문항</small></a>';
    }).join("");
    return;
  }
  document.getElementById("ttl").textContent=주.n;
  document.getElementById("sub").innerHTML='<span class="tag">KILLER DRILL</span> '+e(주.s);
  var 판={
    틀:function(){ return KAN.그리기(주.틀); },
    단계:function(){
      return 주.단계.map(function(d,j){
        return '<div class="card"><div class="y">단계 쪼개기 '+(j+1)+' · '+e(d.y)+'</div>'+
          (d.img?'<img class="fig" src="'+d.img+'" alt="기출">':'')+
          '<ol class="stp">'+d.걸음.map(function(g){
            return '<li>'+KAN.글(g[0])+'<details class="kans"><summary>답 보기</summary><div>'+KAN.글(g[1])+'</div></details></li>';
          }).join("")+'</ol><details class="kans"><summary>정답</summary><div>'+e(d.a)+'</div></details></div>';
      }).join("");
    },
    모음:function(){
      return 주.모음.map(function(x,j){
        return '<div class="card" data-a="'+(x.a||"")+'"><div class="y">드릴 '+(j+1)+' · '+e(x.y)+'</div>'+
          '<img class="fig" src="'+x.img+'" alt="기출">'+
          '<div class="pick5">'+[1,2,3,4,5].map(function(n){return '<button data-n="'+n+'">'+번[n-1]+'</button>';}).join("")+'</div>'+
          '<div class="res"></div>'+(x.h?'<details class="kans"><summary>해설 원문</summary><img class="fig" src="'+x.h+'" alt="해설"></details>':'')+'</div>';
      }).join("");
    }
  };
  function 보기(이름){
    몸.innerHTML='<div class="tabs">'+[["틀","풀이 틀"],["단계","단계 쪼개기"],["모음","기출 모음"]].map(function(t){
      return '<button data-t="'+t[0]+'"'+(t[0]===이름?' class="on"':'')+'>'+t[1]+'</button>';}).join("")+'</div>'+판[이름]();
    몸.querySelectorAll(".tabs button").forEach(function(b){ b.onclick=function(){ 보기(b.dataset.t); window.scrollTo({top:0}); }; });
    몸.querySelectorAll(".card[data-a]").forEach(function(c){
      var a=Number(c.dataset.a);
      c.querySelectorAll(".pick5 button").forEach(function(b){
        b.onclick=function(){
          var n=Number(b.dataset.n);
          c.querySelectorAll(".pick5 button").forEach(function(x){x.disabled=true; if(Number(x.dataset.n)===a) x.classList.add("ok");});
          if(n!==a) b.classList.add("no");
          c.querySelector(".res").innerHTML='<p class="fb '+(n===a?"ok":"no")+'">'+(n===a?"○ 정답":"✕ 정답 "+번[a-1])+'</p>';
        };
      });
    });
  }
  보기(P.get("t")||"틀");
})();
</script>
</body></html>
