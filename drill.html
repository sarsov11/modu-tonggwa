<!-- 킬러 드릴 (2026-10-08 개편, 대표님 「눈으로 풀 수 없는 문항을 문제은행처럼 적어 놓으면 훈련이 안 됨.
     한 문제씩 단계별로 풀게 하되, 막히면 힌트」)
     한 화면에 한 문제. 단계 문제는 걸음마다 묻고 → 힌트 → 답 확인 → 다음 걸음 → 끝에 ①~⑤.
     기출 모음 문제는 ①~⑤ 고르기, 막히면 풀이 순서 힌트, 고른 뒤 해설. 풀이 도구(표)는 접어서 맨 아래. -->
<style>
  .hd h1{font-size:26px;letter-spacing:-.03em;margin:22px 0 6px;font-weight:800;line-height:1.3}
  .hd p{margin:0;color:var(--ink-3);font-size:14px;line-height:1.6}
  .tag{display:inline-block;background:var(--tg-gold);color:var(--pt-ink);font-weight:800;font-size:14px;
    padding:3px 8px;border-radius:12px;letter-spacing:.04em}
  .topic{display:block;border:1.5px solid var(--line-2);border-radius:var(--r3);padding:18px;margin-top:14px;
    text-decoration:none;color:inherit;background:var(--surface)}
  .topic b{display:block;font-size:16px;margin:8px 0 4px}
  .topic small{color:var(--ink-3);font-size:14px}
  .topic .tbar{height:6px;border-radius:999px;background:var(--line);margin-top:12px;overflow:hidden}
  .topic .tbar i{display:block;height:100%;background:var(--accent)}

  .prog{display:flex;align-items:center;gap:10px;margin:18px 0 12px;font-size:14px;font-weight:800;color:var(--ink-3)}
  .prog .tr{flex:1;height:6px;border-radius:999px;background:var(--line);overflow:hidden}
  .prog .tr i{display:block;height:100%;background:var(--accent);transition:width .3s}
  .qsrc{font-size:14px;color:var(--ink-3);font-weight:700;margin:0 0 8px}

  .step{border:1.5px solid var(--accent);border-radius:var(--r2);background:var(--surface);padding:16px;margin-top:14px}
  .step .no{font-size:14px;font-weight:800;color:var(--accent);letter-spacing:.02em}
  .step .q{font-size:16px;font-weight:800;line-height:1.6;margin:6px 0 12px}
  .done-step{border:1px solid var(--line-2);border-radius:var(--r2);background:var(--tg-soft);padding:10px 14px;margin-top:8px;
    font-size:14px;line-height:1.6}
  .done-step b{display:block;color:var(--ink-3);font-size:14px;font-weight:800}
  .hint{background:var(--tg-beige);border-radius:12px;padding:10px 12px;font-size:16px;line-height:1.65;margin:0 0 10px}
  .hint b{color:var(--ink-2)}
  .ans{background:var(--tg-soft);border-left:4px solid var(--accent);border-radius:12px;padding:10px 12px;font-size:16px;font-weight:800;line-height:1.6;margin:0 0 10px}
  .acts2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .acts2 .b{margin:0}
  .fb{font-size:16px;font-weight:800;margin:4px 0 10px}
  .fb.ok{color:var(--accent)} .fb.no{color:var(--red)}
  .pick-lb{font-size:16px;font-weight:800;margin:18px 0 0}
  .tools{margin-top:26px}
  .endbox{text-align:center;padding:30px 0 10px}
  .endbox .big{font-size:26px;font-weight:800;letter-spacing:-.03em}
  .endbox p{color:var(--ink-3);font-size:16px;margin:6px 0 20px}
</style>

<script>
(function(){
  GS.내비("drill.html", new URLSearchParams(location.search).get("k")?{안:"드릴"}:undefined);
  var D=GS.D, e=GS.esc, P=new URLSearchParams(location.search), k=P.get("k");
  var 몸=document.getElementById("body"), 번="①②③④⑤";
  var 힌트=window.DRILL_HINT||{};
  /* 진행 기록 — 드릴마다 푼 문제 번호와 맞힘 */
  var KEY="modutg2.drillrun";
  function 읽기(){ try{ return JSON.parse(localStorage.getItem(KEY)||"{}")||{}; }catch(_){ return {}; } }
  function 쓰기(o){ try{ localStorage.setItem(KEY,JSON.stringify(o)); }catch(_){ } }
  function 정답번호(a){ if(typeof a==="number") return a; var i=번.indexOf(String(a||"").trim().charAt(0)); return i>=0?i+1:Number(a)||0; }

  var 주=(D.drill||[]).filter(function(d){return d.k===k;})[0];
  if(!주){
    var R0=읽기();
    var 추천i=-1; (D.drill||[]).some(function(d,i){ var r=R0[d.k]||{}; if(Object.keys(r.p||{}).length<d.단계.length+d.모음.length){ 추천i=i; return true; } });
    if(추천i<0&&(D.drill||[]).length) 추천i=0;
    몸.innerHTML=(D.drill||[]).map(function(d,i){
      var 수=d.단계.length+d.모음.length, r=R0[d.k]||{}, 푼=Object.keys(r.p||{}).length;
      return '<a class="topic" href="drill.html?k='+encodeURIComponent(d.k)+'"><span class="tag">드릴</span>'+(i===추천i?'<span class="recpill">추천</span>':'')+
        '<b>'+e(d.n)+'</b><small>'+e(d.s)+', 단계 풀이 '+d.단계.length+'문제 + 기출 '+d.모음.length+'문제</small>'+
        '<div class="tbar"><i style="width:'+Math.round(푼/수*100)+'%"></i></div></a>';
    }).join("");
    return;
  }
  document.getElementById("ttl").textContent=주.n;
  var _g=document.getElementById("gtitle"); if(_g) _g.textContent=주.n;
  document.getElementById("sub").innerHTML='<span class="tag">드릴</span> '+e(주.s);

  /* 문제 줄 — 단계 풀이 문제 먼저, 그다음 기출 모음 */
  var 줄=주.단계.map(function(d,j){ return {kind:"단계",j:j,d:d}; })
    .concat(주.모음.map(function(x,j){ return {kind:"모음",j:j,d:x}; }));
  var 순서=(주.틀||[]).filter(function(t){ return /풀이 순서/.test(t.제목||""); });
  var R=읽기(), 내=R[주.k]=R[주.k]||{p:{}}, 지금=Number(P.get("n"));
  if(!(지금>=0&&지금<줄.length)){ 지금=0; while(지금<줄.length&&내.p[지금]!=null) 지금++; if(지금>=줄.length) 지금=0; }

  function 도구(){
    return '<details class="fold tools"><summary>풀이 도구 (표)</summary><div class="in">'+KAN.그리기(주.틀)+'</div></details>';
  }
  var 빈출=TQ.freq(), 바=null;
  TQ.clock();
  function 진행(){
    var 푼=Object.keys(내.p).length;
    return '<div class="tq-prog"><i><u style="width:'+Math.round(푼*100/줄.length)+'%"></u></i><span><b>'+Math.max(0,줄.length-푼)+'</b>문제 남았어요</span></div>';
  }
  function 메타(글){
    return '<div class="tq-meta"><span class="tq-no">'+(지금+1)+'번 문제</span>'+(빈출[주.k]?'<span id="bd"></span>':'')+'<span class="tq-sp"></span><span class="tq-src">'+e(글)+'</span></div>';
  }
  function 기록(맞){ 내.p[지금]=맞?1:0; 쓰기(R); }
  function 다음(){
    if(지금+1>=줄.length){ 끝(); return; }
    지금++; 그리기(); window.scrollTo({top:0});
  }
  function 끝(){
    if(바) 바.hide(); if(window.TERA_PAD&&TERA_PAD.penHide) TERA_PAD.penHide();
    var 맞=Object.keys(내.p).filter(function(i){ return 내.p[i]; }).length;
    몸.innerHTML='<div class="endbox"><div class="big num">'+맞+' / '+줄.length+'</div><p>'+e(주.n)+' 한 바퀴 끝</p>'+
      '<a class="b main" id="again">처음부터 다시</a><a class="b" href="drill.html" style="margin-top:10px">다른 유형</a></div>'+도구();
    document.getElementById("again").onclick=function(){ if(바) 바.el.style.display=""; 내.p={}; 쓰기(R); 지금=0; 그리기(); window.scrollTo({top:0}); };
  }

  var 답함=false;
  function 고르기(host, a, 해설){
    host.innerHTML='<div class="pick5 tq-pick5">'+[1,2,3,4,5].map(function(n){return '<button data-n="'+n+'">'+번[n-1]+'</button>';}).join("")+'</div><div class="res"></div>';
    host.querySelectorAll(".pick5 button").forEach(function(b){
      b.onclick=function(){
        var n=Number(b.dataset.n);
        host.querySelectorAll(".pick5 button").forEach(function(x){ x.disabled=true; if(Number(x.dataset.n)===a) x.classList.add("ok"); });
        if(n!==a) b.classList.add("no");
        기록(n===a);
        host.querySelector(".res").innerHTML='<div class="tq-exp"><div class="tq-tabs"><button type="button" class="is-on">해설</button></div><div class="tq-exp-box">'+
          '<p class="fb '+(n===a?"ok":"no")+'">'+(n===a?"○ 정답":"✕ 오답")+'</p>'+
          (해설?'<details class="fold" open><summary>해설 원문</summary><div class="in"><img class="fig" src="'+해설+'" alt="해설"></div></details>':'')+
          '<span class="tq-ans">정답 : '+a+'번</span></div></div>';
        답함=true; 바.enable(true,true,지금>0);
        몸.querySelector(".tq-prog").outerHTML=진행();
      };
    });
  }

  function 그리기(){
    var it=줄[지금], d=it.d;
    답함=false;
    if(!바){
      바=TQ.bar({exp:true,pen:true,penKey:function(){return "dr"+주.k+"-"+지금;},canPrev:function(){return 지금>0;},
        onPrev:function(){ if(지금>0){ 지금--; 그리기(); window.scrollTo({top:0}); } },
        onNext:function(){ if(답함) 다음(); },
        onExp:function(){ var r=몸.querySelector(".tq-exp"); if(r) r.scrollIntoView({behavior:"smooth",block:"start"}); }});
      TQ.coach(바);
    }
    바.reset(); 바.setPos(지금+1,줄.length);
    setTimeout(function(){ if(빈출[주.k]&&window.TERA_Q&&document.getElementById("bd")) TERA_Q.badge(document.getElementById("bd"),{stars:빈출[주.k]}); },0);
    if(it.kind==="모음"){
      몸.innerHTML=진행()+메타('기출, '+d.y)+QC.칸(d.img)+
        (순서.length?'<div id="hb" style="margin-top:12px"><a class="b" id="hint">힌트, 풀이 순서</a></div>':'')+
        '<p class="pick-lb">답 고르기</p><div id="pk"></div>'+도구();
      QC.채우기(몸);
      var hb=document.getElementById("hint");
      if(hb) hb.onclick=function(){ document.getElementById("hb").innerHTML='<div class="hint">'+KAN.그리기(순서)+'</div>'; };
      고르기(document.getElementById("pk"), 정답번호(d.a), d.h);
      return;
    }
    /* 단계 풀이 문제 — 걸음을 하나씩 */
    var 힌=(힌트[주.k]||[])[it.j]||[], g=0;
    몸.innerHTML=진행()+메타('단계 풀이, '+d.y)+(d.img?QC.칸(d.img):'')+
      '<div id="past"></div><div id="cur"></div>'+도구();
    QC.채우기(몸);
    function 걸음(){
      var cur=document.getElementById("cur");
      if(g>=d.걸음.length){
        cur.innerHTML='<p class="pick-lb">이제 답 고르기</p><div id="pk"></div>';
        고르기(document.getElementById("pk"), 정답번호(d.a), null);
        return;
      }
      var s=d.걸음[g];
      cur.innerHTML='<div class="step"><div class="no">'+(g+1)+'단계 / '+d.걸음.length+'</div><div class="q">'+KAN.글(s[0])+'</div>'+
        '<div id="hs"></div><div id="as"></div>'+
        '<div class="acts2" id="ab">'+(힌[g]?'<a class="b" id="hb">힌트</a>':'<span></span>')+'<a class="b main" id="sb">확정</a></div></div>';
      var hb=document.getElementById("hb");
      if(hb) hb.onclick=function(){ document.getElementById("hs").innerHTML='<div class="hint"><b>힌트</b> '+e(힌[g])+'</div>'; hb.style.visibility="hidden"; };
      document.getElementById("sb").onclick=function(){
        document.getElementById("as").innerHTML='<div class="ans">'+KAN.글(s[1])+'</div>';
        document.getElementById("ab").innerHTML='<span></span><a class="b main" id="nb">'+(g+1>=d.걸음.length?"다음":"다음")+'</a>';
        document.getElementById("nb").onclick=function(){
          document.getElementById("past").insertAdjacentHTML("beforeend",
            '<div class="done-step"><b>'+(g+1)+'단계</b>'+KAN.글(s[0])+' → '+KAN.글(s[1])+'</div>');
          g++; 걸음();
          var c=document.getElementById("cur"); if(c) c.scrollIntoView({block:"start",behavior:"smooth"});
        };
      };
    }
    걸음();
  }
  그리기();
})();
</script>
