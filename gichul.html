<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>기출 원문 — 모두의 통과</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/g.css">
<script>try{var _s=localStorage.getItem("modutg2.skin")||"white";document.documentElement.dataset.skin=_s;}catch(e){document.documentElement.dataset.skin="white";}</script>
<style>
  .hd h1{font-size:26px;letter-spacing:-.03em;margin:26px 0 4px;font-weight:900}
  .hd p{margin:0;color:var(--ink-3);font-size:14.5px}
  .prog{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-3);font-weight:700;margin:18px 0 10px}
  .fb{font-size:16px;font-weight:800;margin:6px 0 10px}
  .fb.ok{color:var(--accent)} .fb.no{color:var(--red)}
</style>
</head><body>
<div class="page">
  <div class="hd"><h1 id="ttl">기출 원문</h1><p></p></div>
  <div id="body"></div>
</div>
<script src="js/gdata.js"></script>
<script src="js/gstore.js"></script>
<script>
(function(){
  GS.내비("");
  var D=GS.D, e=GS.esc, k=new URLSearchParams(location.search).get("k"), 번="①②③④⑤";
  var t=GS.테마맵[k]||{}, 몸=document.getElementById("body");
  var xs=(D.gichul||[]).filter(function(x){return x.k===k;});
  document.getElementById("ttl").textContent=(t.n||"기출 원문");
  if(!xs.length){ 몸.innerHTML='<div class="none">기출 없음<br><a href="tree.html">다른 단원 학습</a></div>'; return; }
  var i=0, 맞=0;
  function 그리기(){
    window.ZZ && ZZ.quiet && ZZ.quiet(700);
    if(i>=xs.length){
      몸.innerHTML='<div class="none"><b style="font-size:22px;color:var(--ink)">'+맞+' / '+xs.length+'</b></div>'+
        '<a class="b main" href="ox.html?k='+encodeURIComponent(k)+'">O·X</a>';
      if(window.ZZ){ var r=맞/xs.length; if(r>=1) ZZ.stars(3); else if(r>=0.7) ZZ.stars(2); else if(r>=0.4) ZZ.stars(1); }
      return;
    }
    var x=xs[i];
    몸.innerHTML='<div class="prog"><span>'+(i+1)+' / '+xs.length+'</span><span>'+e(x.y)+'</span></div>'+
      '<img class="fig" src="'+x.img+'" alt="기출">'+
      '<div class="pick5">'+[1,2,3,4,5].map(function(n){return '<button data-n="'+n+'">'+번[n-1]+'</button>';}).join("")+'</div>'+
      '<div id="res"></div>';
    몸.querySelectorAll(".pick5 button").forEach(function(b){
      b.onclick=function(){
        var n=Number(b.dataset.n), ok=(n===x.a); if(ok) 맞++;
        몸.querySelectorAll(".pick5 button").forEach(function(y){y.disabled=true; if(Number(y.dataset.n)===x.a) y.classList.add("ok");});
        if(!ok) b.classList.add("no");
        if(window.ZZ) (ok ? ZZ.ok : ZZ.no)(b);
        document.getElementById("res").innerHTML='<p class="fb '+(ok?"ok":"no")+'">'+(ok?"○ 정답":"✕ 정답 "+번[x.a-1])+'</p>'+
          (x.h?'<details class="orig" open><summary style="cursor:pointer;color:var(--ink-3);font-weight:700">해설 원문</summary><img class="fig" style="margin-top:8px" src="'+x.h+'" alt="해설"></details>':'')+
          '<button class="b main stickb" style="margin-top:14px" id="nx">'+(i+1<xs.length?"다음":"결과")+'</button>';
        document.getElementById("nx").onclick=function(){ i++; 그리기(); window.scrollTo({top:0}); };
      };
    });
  }
  그리기();
})();
</script>
<script src="js/zzsfx.js?v=1009a" defer></script><script src="js/zzajan.js?v=1009a" defer></script>
</body></html>
