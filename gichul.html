<style>
  /* 2026-11-10 문제 화면 — tera-q 공용 부품(css/tera-q.css) + 앱 덧붙임(g.css 끝) */

<script>
(function(){
  GS.내비("",{안:"기출 원문"});
  var D=GS.D, e=GS.esc, k=new URLSearchParams(location.search).get("k"), 번="①②③④⑤";
  var t=GS.테마맵[k]||{}, 몸=document.getElementById("body");
  var xs=(D.gichul||[]).filter(function(x){return x.k===k;});
  document.getElementById("ttl").textContent=(t.n||"기출 원문");
  if(!k){
    var 수={}; (D.gichul||[]).forEach(function(x){ 수[x.k]=(수[x.k]||0)+1; });
    document.getElementById("ttl").textContent="기출 원문";
    var 목록=D.테마.filter(function(x){return 수[x.k];}), 할=(GS.오늘할것&&GS.오늘할것())||{}, 추천k=목록.some(function(x){return x.k===할.k;})?할.k:(목록[0]&&목록[0].k);
    document.getElementById("tqw").classList.remove("has-omr"); document.getElementById("omr").style.display="none";
    몸.innerHTML=목록.map(function(x){
      return '<a class="th" style="display:flex;justify-content:space-between;padding:14px 2px;border-top:1px solid var(--line);text-decoration:none;color:inherit" href="gichul.html?k='+encodeURIComponent(x.k)+'"><b>'+e(x.n)+(x.k===추천k?'<span class="recpill">추천</span>':'')+'</b><span style="color:var(--ink-3)">'+e(x.s)+' · '+수[x.k]+'문항</span></a>';
    }).join("");
    return;
  }
  if(!xs.length){ 몸.innerHTML='<div class="none">기출 없음<br><a class="b main" href="tree.html">합격 지도</a></div>'; return; }
  var i=0, ans=[], 바=null, 빈출=TQ.freq(), 판=document.getElementById("omr");
  TQ.clock();
  function 푼수(){ return ans.filter(function(a){ return a!=null; }).length; }
  function 막대(){
    var n=xs.length, 푼=푼수();
    return '<div class="tq-prog"><i><u style="width:'+Math.round(푼*100/n)+'%"></u></i><span><b>'+(n-푼)+'</b>문제 남았어요</span></div>';
  }
  /* 11-10 표준 8절 — 통합과학 계산 문항에만 「풀이 창」. steps 자료가 없으면 steps 없이 연다 */
  function 풀이창(host, anchor, key){
    try{
      if(!window.TERA_PAD || !host || !anchor) return;
      if(!TERA_PAD.isCalc(host.textContent||"")) return;
      var w=document.createElement("div"); w.className="padrow"; w.style.cssText="margin:0 0 12px;display:flex;justify-content:flex-start";
      TERA_PAD.button(w,{key:key,title:""});
      anchor.insertAdjacentElement("beforebegin",w);
    }catch(e){}
  }
  function 번호판(){
    var 안=xs.length-푼수();
    판.innerHTML='<span id="jp"></span>'+xs.map(function(_,j){
      var a=ans[j];
      return '<div class="tq-omr-row'+(j===i?' is-now':'')+(a==null?' is-todo':'')+'" data-j="'+j+'"><span class="tq-qn">'+(j+1)+'번</span>'+
        [1,2,3,4,5].map(function(n){ return '<i'+(a===n?' class="is-on"':'')+'>'+n+'</i>'; }).join("")+'</div>';
    }).join("");
    var jp=TERA_Q.jump(document.getElementById("jp"),{count:안,onClick:function(){
      for(var j=0;j<xs.length;j++){ var q=(i+1+j)%xs.length; if(ans[q]==null){ i=q; 그리기(); return; } } }});
    판.querySelectorAll(".tq-omr-row").forEach(function(r){ r.onclick=function(){ i=Number(r.dataset.j); 판.classList.remove("is-open"); 그리기(); }; });
  }
  function 결과표시(x){
    var n=ans[i], ok=(n===x.a);
    document.getElementById("res").innerHTML='<div class="tq-exp"><div class="tq-tabs"><button type="button" class="is-on">해설</button>'+
      ((D.cards||{})[k]?'<button type="button" id="tabk">개념</button>':'')+'</div><div class="tq-exp-box">'+
      '<p class="fb '+(ok?"ok":"no")+'">'+(ok?"○ 정답":"✕ 오답")+'</p>'+
      (x.h?'<details class="orig" open><summary>해설 원문</summary><img class="fig" src="'+x.h+'" alt="해설"></details>':'')+
      '<span class="tq-ans">정답 : '+x.a+'번</span></div></div>';
    var tk=document.getElementById("tabk"); if(tk) tk.onclick=function(){ location.href="card.html?k="+encodeURIComponent(k); };
  }
  function 끝(){
    if(바) 바.hide(); 판.style.display="none"; document.getElementById("tqw").classList.remove("has-omr");
    if(window.TERA_PAD&&TERA_PAD.penHide) TERA_PAD.penHide();
    var 맞=xs.filter(function(x,j){ return ans[j]===x.a; }).length;
    몸.innerHTML='<div class="none"><b style="font-size:20px;color:var(--ink)">'+맞+' / '+xs.length+'</b></div>'+
      '<a class="b main" href="ox.html?k='+encodeURIComponent(k)+'">O·X</a>';
  }
  function 그리기(){
    if(i>=xs.length) return 끝();
    var x=xs[i];
    if(!바){
      바=TQ.bar({exp:true,pen:true,penKey:function(){return "tgg"+i;},canPrev:function(){return i>0;},
        onPrev:function(){ if(i>0){ i--; 그리기(); } },
        onNext:function(){ if(ans[i]==null) return; i++; 그리기(); },
        onExp:function(){ var r=document.getElementById("res"); if(r&&r.firstChild) r.scrollIntoView({behavior:"smooth",block:"start"}); }});
      바.el.querySelector(".tq-pos").onclick=function(){ 판.classList.toggle("is-open"); };
      TQ.coach(바);
    }
    바.reset(); 바.setPos(i+1,xs.length);
    window.scrollTo({top:0});
    몸.innerHTML=막대()+
      '<div class="tq-meta"><span class="tq-no">'+(i+1)+'번 문제</span>'+(빈출[k]?'<span id="bd"></span>':'')+
        '<span class="tq-sp"></span><span class="tq-src">'+e(x.y)+'</span></div>'+
      QC.칸(x.img)+
      '<div class="pick5 tq-pick5">'+[1,2,3,4,5].map(function(n){return '<button data-n="'+n+'">'+번[n-1]+'</button>';}).join("")+'</div>'+
      '<div id="res"></div>';
    if(빈출[k]&&window.TERA_Q) TERA_Q.badge(document.getElementById("bd"),{stars:빈출[k]});
    QC.채우기(몸);
    setTimeout(function(){ 풀이창(몸.querySelector(".qc"), 몸.querySelector(".pick5"), "tgg"+i); },700);
    var 이미=ans[i];
    function 표시(n){
      몸.querySelectorAll(".pick5 button").forEach(function(y){y.disabled=true; if(Number(y.dataset.n)===x.a) y.classList.add("ok");});
      if(n!==x.a) 몸.querySelector('.pick5 button[data-n="'+n+'"]').classList.add("no");
      결과표시(x); 바.enable(true,!!x.h,i>0);
      몸.querySelector(".tq-prog").outerHTML=막대(); 번호판();
    }
    if(이미!=null) 표시(이미); else 바.enable(false,false,i>0);
    몸.querySelectorAll(".pick5 button").forEach(function(b){
      b.onclick=function(){ if(ans[i]!=null) return; ans[i]=Number(b.dataset.n); 표시(ans[i]); };
    });
    번호판();
  }
  그리기();
})();
</script>
