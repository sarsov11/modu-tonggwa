<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>O·X — 모두의 통과</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/g.css">
<link rel="stylesheet" href="css/tera-q.css?v=1110p">
<script>try{var _s=localStorage.getItem("modutg2.skin")||"white";document.documentElement.dataset.skin=_s;}catch(e){document.documentElement.dataset.skin="white";}</script>
<style>
  /* 2026-11-10 문제 화면 — tera-q 공용 부품(css/tera-q.css) + 앱 덧붙임(g.css 끝) */
  .tq-wrap #stage .done{text-align:center;padding:30px 4px}
  .done h2{font-size:26px;margin:0 0 18px;letter-spacing:-.03em}
  .tally{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 22px}
  .tally div{border:0;border-radius:18px;background:var(--surface);box-shadow:0 1px 2px rgba(17,20,25,.05),0 0 0 1px var(--line);padding:14px 6px}
  .tally b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
  .tally span{font-size:13px;font-weight:600;color:var(--ink-3)}
  .done .b{margin-bottom:10px}
  .orig summary{cursor:pointer;color:var(--ink-3);font-size:14px;font-weight:700}
  .orig .fig{display:block;width:100%;border:1px solid var(--line-2);border-radius:12px}
</style>
</head><body>
<div class="page tq-wrap">
  <div id="stage"></div>
</div>
<script src="js/gdata.js"></script>
<script src="js/judge.js"></script>
<script src="js/gstore.js"></script>
<script src="js/tera-pad.js?v=1110p"></script>
<script src="js/terms.js?v=1110t" onerror="void 0"></script>
<script src="js/tera-q.js?v=1110p"></script>
<script src="js/tq-tonggwa.js"></script>
<script>
(function(){
  GS.내비("",{안:"기출 O·X"});
  var D=GS.D, e=GS.esc, P=new URLSearchParams(location.search);
  var k=P.get("k"), 복습=P.get("review")==="1";
  var 문장들 = 복습 ? GS.다시볼것().slice(0,12) : GS.세션(k,12);
  var 테마 = k ? GS.테마맵[k] : null, 제목;
  if(테마) var 제목=테마.n;
  else if(복습) var 제목="복습";
  document.getElementById("gtitle").textContent = (typeof 제목==="string"?제목:"기출 O·X");

  var i=0, 결과=[], 확신=null, 시작=0;
  var 번호=["①","②","③","④"];
  function el(x){return document.getElementById(x);}

  if(!문장들.length){
    el("stage").innerHTML='<div class="none">문장 없음<br>'+
      '<a class="b main" href="tree.html">합격 지도</a></div>';
    return;
  }

  /* 11-10 표준 9절 — 판정 문구의 옛 말을 표준 용어로(judge.js 는 통사 정본이라 앱 쪽에서 바꾼다) */
  function 용어(t){ return String(t||"").replace(/개념 먼저 읽기/g,"개념 먼저").replace(/먼저 읽기/g,"개념").replace(/개념 읽기/g,"개념").replace(/다음 문제/g,"다음").replace(/오답 모아풀기/g,"복습"); }
  var 바=null, 답함=false;
  TQ.clock();
  var 빈출=TQ.freq();
  function 진행(){ /* 막대는 그리기()가 stage 안에 다시 그린다 */ }
  function 막대(){
    var n=문장들.length, 푼=결과.filter(Boolean).length;
    return '<div class="tq-prog"><i><u style="width:'+Math.round(푼*100/n)+'%"></u></i><span><b>'+Math.max(0,n-푼)+'</b>문제 남았어요</span></div>';
  }

  /* 11-10 표준 8절 — 통합과학 계산 문항에만 「풀이 창」. steps 자료가 없으면 steps 없이 연다 */
  function 풀이창(host, anchor, key){
    try{
      if(!window.TERA_PAD || !host || !anchor) return;
      if(!TERA_PAD.isCalc(host.textContent||"")) return;
      var w=document.createElement("div"); w.className="padrow"; w.style.cssText="margin:0 0 12px;display:flex;justify-content:flex-start";
      TERA_PAD.button(w,{key:key,title:""});
      anchor.insertAdjacentElement("beforebegin",w);
    }catch(e){}
  }
  function 그리기(){
    window.ZZ && ZZ.quiet && ZZ.quiet(700);
    if(i>=문장들.length) return 끝();
    var o=문장들[i], q=D.qs[o.q]||{}, t=GS.테마맵[o.k]||{};
    확신="sure"; 시작=Date.now(); 답함=false;
    if(!바){
      바=TQ.bar({conf:true,exp:true,pen:true,penKey:function(){return "tg"+문장들[i].i;},
        onConf:function(v){ 확신=v; },
        onNext:function(){ if(!답함) return; i++; 그리기(); },
        onExp:function(){ var v=el("vd"); if(v&&v.firstChild) v.scrollIntoView({behavior:"smooth",block:"start"}); }});
      TQ.coach(바);
    }
    바.reset(); 바.setPos(i+1,문장들.length); 바.unlockConf();
    el("stage").innerHTML=
      막대()+
      '<div class="tq-meta"><span class="tq-no">'+(i+1)+'번 문제</span>'+(빈출[o.k]?'<span id="bd"></span>':'')+
        '<span class="tq-th">'+e(t.n||"")+'</span><span class="tq-sp"></span><span class="tq-src">'+e(q.y||"")+'</span><span id="tqtg"></span></div>'+
      (q.f?'<div class="tq-box"><img class="fig" src="'+q.f+'" alt="자료"></div>':'')+
      '<p class="tq-stem">'+(o.ci?'<img src="'+o.ci+'" alt="보기">':(o.n?e(o.n)+'. ':'')+o.c)+'</p>'+
      '<div class="tq-ox" id="ox"><button type="button" class="o" data-v="1">O</button><button type="button" class="x" data-v="0">X</button></div>'+
      '<div id="vd"></div>';
    if(빈출[o.k]&&window.TERA_Q) TERA_Q.badge(el("bd"),{stars:빈출[o.k]});
    if(window.TERA_Q){ TERA_Q.toggle(el("tqtg")); TERA_Q.annotate(document.querySelector("#stage .tq-stem")); }
    풀이창(document.querySelector("#stage .tq-stem"), document.querySelector("#stage .tq-ox"), "tg"+o.i);
    document.querySelectorAll("#ox button").forEach(function(b){
      b.onclick=function(){ if(!답함) 답하기(Number(b.dataset.v),b); };
    });
    window.scrollTo({top:0,behavior:"smooth"});
  }

  function 답하기(v,btn){
    var o=문장들[i], q=D.qs[o.q]||{}, t=GS.테마맵[o.k]||{};
    var ok=(v===o.a), ms=Date.now()-시작;
    답함=true; 바.lockConf();
    document.querySelectorAll("#ox button").forEach(function(x){ x.disabled=true; if(x!==btn) x.classList.add("is-rest"); });
    btn.classList.add(ok?"is-ok":"is-no");
    if(window.ZZ) (ok ? ZZ.ok : ZZ.no)(btn);
    var 전=GS.S.ox[o.i];
    var 판=JUDGE.판정({ok:ok,conf:확신,ms:ms,attempt:전?전.n+1:1,qid:o.i,
      mastery:GS.숙련(o.k),streak:GS.연속오답(o.k),leafName:t.n});
    GS.기록(o.i,ok,확신,ms);
    결과[i]={ok:ok,kind:판.kind};
    var 마지막=(i+1>=문장들.length);
    var 개념있음=(D.cards||{})[o.k];
    el("stage").querySelector(".tq-prog").outerHTML=막대();
    el("vd").innerHTML=
      '<div class="tq-exp"><div class="tq-tabs"><button type="button" class="is-on">해설</button>'+
        (개념있음?'<button type="button" id="tabk">개념</button>':'')+'</div>'+
      '<div class="tq-exp-box '+판.tone+'">'+
        '<div class="top"><span class="mark">'+(ok?"○ 정답":"✕ 오답")+'</span><span class="kind">'+e(판.label||판.kind)+'</span></div>'+
        '<p class="say">'+e(용어(판.say))+'</p>'+
        (q.h?'<details class="orig"'+(ok?'':' open')+'><summary>해설 원문</summary><img class="fig" style="margin-top:10px" src="'+q.h+'" alt="해설"></details>':'')+
        (q.x?'<details class="orig"><summary>시험지 원문 · 기출 정답 '+e(q.a)+'</summary><img class="fig" style="margin-top:10px" src="'+q.x+'" alt="기출"></details>':'')+
        '<span class="tq-ans">정답 : '+(o.a?"O":"X")+'</span>'+
      '</div></div>';
    var tk=el("tabk"); if(tk) tk.onclick=function(){ location.href="card.html?k="+encodeURIComponent(o.k); };
    바.enable(true,true,false);
    el("vd").scrollIntoView({behavior:"smooth",block:"start"});
  }

  function 끝(){
    var 맞=결과.filter(function(r){return r.ok;}).length;
    var 오개념=결과.filter(function(r){return r.kind==="오개념";}).length;
    var m=k?GS.숙련(k):null;
    if(바) 바.hide(); if(window.TERA_PAD&&TERA_PAD.penHide) TERA_PAD.penHide();
    el("stage").innerHTML=
      '<div class="done"><h2>'+(k&&테마?e(테마.n):"오늘 문장")+'</h2>'+
        
        '<div class="tally"><div><b>'+맞+'/'+결과.length+'</b><span>맞힘</span></div>'+
          '<div><b>'+오개념+'</b><span>확신 오답</span></div>'+
          '<div><b>'+(m==null?"—":Math.round(m*100)+"%")+'</b><span>이 단원</span></div></div>'+
        /* ★ 결과 뒤에 고르게 하지 않는다 — 오늘 할 것 다음 하나를 큰 단추로(2026-10-09 흐름 점검: 주 단추가 「홈」 뿐이었다) */
        (function(){ var nx=GS.오늘할것&&GS.오늘할것();
          if(nx && !(nx.k && nx.k===k)) return '<a class="b main" href="'+(nx.k?'ox.html?k='+encodeURIComponent(nx.k):'ox.html?review=1')+'">다음: '+e(nx.이름)+(nx.n?' '+nx.n+'개':'')+' →</a>'+
            '<a class="b" href="index.html">오늘</a>';
          if(nx) return '<a class="b main" href="card.html?k='+encodeURIComponent(k)+'">개념 보고 다시: '+e(nx.이름)+' →</a><a class="b" href="index.html">오늘</a>';
          return '<a class="b main" href="index.html">오늘</a>'; })()+
        (k?'<div class="b2"><a class="b" href="ox.html?k='+encodeURIComponent(k)+'">다시</a>'+
          '<a class="b" href="card.html?k='+encodeURIComponent(k)+'">개념</a></div>':'')+
      '</div>';
    window.scrollTo({top:0,behavior:"smooth"});
  }
  그리기();
})();
</script>
<!-- 테라러닝 홈 단추(공용 terrahome) -->
<style>.gbar>a.th-home{position:absolute;left:12px;top:50%;transform:translateY(-50%);margin:0;max-width:none;height:30px;padding:0 10px 0 7px;gap:5px;font-size:13px;display:inline-flex}@media(max-width:760px){.gbar>a:not(.th-home){padding-left:118px;padding-right:64px}}</style><script src="js/terrahome.js?v=243c5cfd" data-slot=".gbar" defer></script>
</body></html>
