<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#0F766E">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icons/icon-192.png">

<script>try{var _s=localStorage.getItem("modutg2.skin")||"white";if(_s==="paper"||_s==="jelly")_s="white";document.documentElement.dataset.skin=_s;}catch(e){document.documentElement.dataset.skin="white";}</script>
<style>
  /* 2026-11-10 화면표준 5절 — 쪽 제목 26px · 묶음마다 판 · 고르는 단추 44px */
  .hd h1{font-size:26px;letter-spacing:-.03em;margin:22px 0 16px;font-weight:800}
  .sk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .fold .in .b{min-height:44px;height:44px;border-radius:12px;font-size:14px}
</style>
</head><body>
<div class="page">
  <div class="hd"><h1>설정</h1></div>
  <details class="fold" open><summary>공부<span class="recpill">추천</span></summary><div class="in"><div id="tdt"></div></div></details>
  <details class="fold" data-zs="1"><summary>합격 전략</summary></details>
  <details class="fold"><summary>시험일</summary><div class="in">
    <input type="date" id="exam">
  </div></details>
  <details class="fold"><summary>화면</summary><div class="in">
    <div class="sk" id="skins"></div>
  </div></details>
  <details class="fold"><summary>기록</summary><div class="in">
    <button class="b" id="reset">기록 전부 지우기</button>
  </div></details>
</div>
<script src="js/zzstrat.js?v=1111h"></script><script src="js/zzstrat_tonggwa.js"></script><script src="js/zzstrat_cover.js?v=1111h"></script>
<script src="js/gdata.js"></script>
<script src="js/gstore.js"></script>
<script src="js/tera-daeip-time.js?v=1111h"></script>
<script>
(function(){
  GS.내비("settings.html");
  TERA_DAEIP.mount(document.getElementById("tdt"),"tonggwa");
  var x=document.getElementById("exam");
  x.value=GS.S.시험일||"";
  x.onchange=function(){ GS.S.시험일=x.value; GS.저장(); };
  var 스킨=[["white","화이트"],["night","밤"]];   /* 11-11 청록 단일톤: 종이·분홍은 다른 색 바탕이라 뺐다 */
  var 지금=localStorage.getItem("modutg2.skin")||"white";if(지금==="paper"||지금==="jelly")지금="white";
  document.getElementById("skins").innerHTML=스킨.map(function(s){
    return '<button data-s="'+s[0]+'" aria-pressed="'+(s[0]===지금)+'">'+s[1]+'</button>';
  }).join("");
  document.querySelectorAll("#skins button").forEach(function(b){
    b.onclick=function(){
      var v=b.dataset.s; localStorage.setItem("modutg2.skin",v);
      document.documentElement.dataset.skin=(v==="night"?"":v); location.reload();
    };
  });
  document.getElementById("reset").onclick=function(){
    if(confirm("기록 전부 삭제")){ GS.초기화(); try{localStorage.removeItem("modutg2.drillrun");}catch(_){} location.href="index.html"; }
  };
})();
</script>
